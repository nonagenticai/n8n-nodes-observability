<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e" stroke="#4a90d9" stroke-width="2"/>

  <!-- Chart bars representing metrics -->
  <rect x="14" y="38" width="8" height="16" rx="1" fill="#4a90d9"/>
  <rect x="28" y="28" width="8" height="26" rx="1" fill="#6bb3f0"/>
  <rect x="42" y="20" width="8" height="34" rx="1" fill="#4a90d9"/>

  <!-- Line graph overlay -->
  <polyline
    points="14,42 22,35 32,30 42,22 50,18"
    stroke="#f39c12"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"/>

  <!-- Data points -->
  <circle cx="14" cy="42" r="3" fill="#f39c12"/>
  <circle cx="22" cy="35" r="3" fill="#f39c12"/>
  <circle cx="32" cy="30" r="3" fill="#f39c12"/>
  <circle cx="42" cy="22" r="3" fill="#f39c12"/>
  <circle cx="50" cy="18" r="3" fill="#f39c12"/>

  <!-- Eye symbol for observability -->
  <ellipse cx="32" cy="14" rx="8" ry="5" fill="none" stroke="#6bb3f0" stroke-width="1.5"/>
  <circle cx="32" cy="14" r="2" fill="#6bb3f0"/>
</svg>
